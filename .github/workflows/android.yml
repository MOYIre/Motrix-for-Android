name: Android

# Cloud build for the Motrix for Android APK.
#
# The APK is a shell around prebuilt artifacts, so the job first assembles the
# server bundle (Vite builds), then stages the Android arm64 runtime leaves
# (Termux packages, a cross-compiled better-sqlite3, the finalize sidecar) and
# finally packages them with Gradle. The signing key is committed on purpose
# (see android/keystore/keystore.properties) so the build needs no secrets.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/android**'
    paths:
      - 'android/**'
      - 'scripts/android/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/android/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Node version the APK ships (the Termux package pinned in
      # scripts/android/termux-packages.json must match this series).
      MOTRIX_ANDROID_NODE_VERSION: 26.3.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1
          run_install: false

      - name: Install Node toolchain
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        env:
          # The Electron runtime is only needed by desktop packaging; the
          # Android build assembles the Node server bundle instead.
          MOTRIX_SKIP_ELECTRON_REBUILD: '1'
          MOTRIX_SKIP_ENGINE_FETCH: '1'
        run: pnpm install --frozen-lockfile

      - name: Build server bundle
        run: |
          pnpm run build:builtin
          pnpm run check:plugin-security
          pnpm exec vite build --config vite.server.config.ts
          pnpm exec vite build --config vite.worker.config.ts
          pnpm exec vite build --config vite.renderer.web.config.ts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf zip
          patchelf --version

      - name: Build the finalize sidecar for Android
        env:
          NDK_VERSION: 27.2.12479018
        run: |
          TOOLCHAIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          cargo build --manifest-path packages/finalize-fs/Cargo.toml \
            --release --target aarch64-linux-android
          mkdir -p build/android
          cp packages/finalize-fs/target/aarch64-linux-android/release/motrix-finalize-fs \
            build/android/motrix-finalize-fs

      - name: Build better-sqlite3 for Android
        env:
          NDK_VERSION: 27.2.12479018
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64"
          export CC="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          export CXX="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export LD="$TOOLCHAIN/bin/ld.lld"
          HEADERS_DIR="$RUNNER_TEMP/node-headers"
          mkdir -p "$HEADERS_DIR"
          curl -fsSL "https://nodejs.org/dist/v$MOTRIX_ANDROID_NODE_VERSION/node-v$MOTRIX_ANDROID_NODE_VERSION-headers.tar.gz" \
            | tar -xz -C "$HEADERS_DIR" --strip-components=1
          cd node_modules/better-sqlite3
          rm -rf build prebuilds
          pnpm exec node-gyp rebuild \
            --arch=arm64 --dest-os=android --nodedir="$HEADERS_DIR"
          mkdir -p "$GITHUB_WORKSPACE/build/android"
          cp build/Release/better_sqlite3.node "$GITHUB_WORKSPACE/build/android/better_sqlite3.node"

      - name: Stage runtime and native libraries
        run: |
          node scripts/android/package-runtime.mjs \
            --app android/app \
            --finalize-fs build/android/motrix-finalize-fs \
            --better-sqlite3 build/android/better_sqlite3.node

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Assemble release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        working-directory: android
        run: |
          set -euo pipefail
          # Decrypt the signing key into the build directory; when the secrets
          # are missing the Gradle config falls back to debug signing.
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            mkdir -p build/keystore
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > build/keystore/release.jks
          fi
          gradle --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p build/android/out
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} build/android/out/ \;
          ls -la build/android/out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: motrix-android-apk
          path: build/android/out/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A rolling "android-latest" release keeps exactly one installable
          # build visible on the Releases page.
          RELEASE_TAG="android-latest"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag
          fi
          gh release create "$RELEASE_TAG" build/android/out/*.apk \
            --title "Motrix for Android" \
            --notes "由 GitHub Actions 自动构建并签名（commit \`$GITHUB_SHA\`）。

            ## 安装

            下载 \`app-release.apk\` 并安装。首次启动授予“所有文件访问”权限后，
            下载文件将保存到公共 Download 目录；界面默认简体中文。

            > 本构建由自动化流水线生成，请确认下载来源为官方仓库。"
