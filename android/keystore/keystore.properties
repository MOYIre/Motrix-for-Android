# Signing material for the self-built Android APK.
#
# This is a build key for personal/local installs, not a publishing identity:
# it is committed on purpose so cloud builds are reproducible without secrets.
# Replace it with a private keystore held in CI secrets before shipping to any
# store, and never reuse it for a published application.
storeFile=keystore/motrix-release.jks
storePassword=motrixandroid
keyAlias=motrix
keyPassword=motrixandroid
